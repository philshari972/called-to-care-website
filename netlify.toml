[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Only our own sites may show these pages in a frame (the Charity Dinner Dashboard shows the auction tools this way)
    Content-Security-Policy = "frame-ancestors 'self' https://wearecalledtocare.com https://www.wearecalledtocare.com https://dashboard.wearecalledtocare.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
