<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C81E1E"><link rel="icon" href="img/icon.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Called To Care Auction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column (max 600px), sticky red test banner + event bar on top, fixed tab bar at bottom, item detail as a full-height sheet */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EAEEF5; --ink:#14233C; --muted:#5A6579; --line:#DCE2EC;
  --accent:#D99A00; --accent-ink:#5C4100; --btn:#14233C; --btn-fg:#FFFFFF;
  --win:#17784B; --win-bg:#DDF3E7; --out:#C2410C; --out-bg:#FDE8DD; --test:#C81E1E; --test-fg:#FFFFFF;
  --cat-travel:#2F6F8F; --cat-dining:#9A4A2B; --cat-sports:#3E7D3A; --cat-home:#7A5A9A; --cat-kids:#B3741A; --cat-exp:#285C7A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#161F30; --surface-2:#1E293D; --ink:#E9EEF7; --muted:#9AA6BA; --line:#27334A;
  --accent:#F2B92B; --accent-ink:#F2B92B; --btn:#E9EEF7; --btn-fg:#0D1320;
  --win:#43C98F; --win-bg:#123327; --out:#FF8A57; --out-bg:#3A1E12; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#161F30; --surface-2:#1E293D; --ink:#E9EEF7; --muted:#9AA6BA; --line:#27334A;
  --accent:#F2B92B; --accent-ink:#F2B92B; --btn:#E9EEF7; --btn-fg:#0D1320;
  --win:#43C98F; --win-bg:#123327; --out:#FF8A57; --out-bg:#3A1E12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--test)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* Top: test banner + event bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.banner{background:var(--test);color:var(--test-fg);text-align:center;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.banner button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:none}
.eventbar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eventbar-in{max-width:600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ev-name{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.1}
.ev-sub{font-size:12px;color:var(--muted)}
.clock{text-align:right;flex-shrink:0}
.clock b{display:block;font-family:var(--f-mono);font-size:20px;line-height:1.1}
.clock span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.clock.paused b{color:var(--out)}

/* Page */
main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sum{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;text-align:left;cursor:pointer}
.sum b{font-size:14px;font-weight:700;line-height:1}
.sum span{font-size:12px;color:var(--muted);white-space:nowrap}
.sum.win b{color:var(--win)} .sum.out b{color:var(--out)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px}
.search select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 10px;font-size:14px;max-width:44%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}

/* Item cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;position:relative}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:#fff}
.thumb svg{width:38%;height:auto;opacity:.92}
.thumb .no{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:11px;background:rgba(0,0,0,.28);padding:2px 7px;border-radius:6px}
.heart{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;display:grid;place-items:center}
.heart svg{width:18px;height:18px}
.heart[aria-pressed="true"] svg{fill:#fff}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.ctitle{font-weight:700;font-size:14px;line-height:1.25}
.cprice{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1}
.cmeta{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.list .grid{grid-template-columns:1fr}
.list .card{flex-direction:row}
.list .thumb{width:112px;flex-shrink:0;aspect-ratio:auto}
.list .heart{width:30px;height:30px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;width:max-content}
.pill.win{background:var(--win-bg);color:var(--win)}
.pill.out{background:var(--out-bg);color:var(--out)}
.pill.closed{background:var(--surface-2);color:var(--muted)}
.pill.res{background:var(--surface-2);color:var(--muted)}
.pill.test{background:var(--test);color:var(--test-fg)}
.card.is-win{border-color:var(--win)} .card.is-out{border-color:var(--out)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn.danger{background:var(--test);color:#fff;border-color:var(--test)}
.btn.small{min-height:34px;padding:6px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Sections */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:19px}
.sec h3{font-size:15px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row > *{min-width:0}
.rows{display:flex;flex-direction:column}
.rows > .row{padding-block:10px;border-top:1px solid var(--line)}
.rows > .row:first-child{border-top:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400;width:100%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin:1px 0 0;flex-shrink:0;accent-color:var(--btn)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:460px;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px}
.receipt{border:2px dashed var(--test);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.receipt .stamp{color:var(--test);font-weight:800;letter-spacing:.06em;font-size:12px;text-transform:uppercase}

/* Alerts */
.alert{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--muted)}
.alert.outbid .dot{background:var(--out)} .alert.lead .dot,.alert.win .dot{background:var(--win)} .alert.pay .dot{background:var(--accent)}
.alert.unread{border-color:var(--ink)}
.alert time{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--out);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}

/* Sheet / modal */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(8,12,20,.5);display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-test{position:sticky;top:0;z-index:2;background:var(--test);color:#fff;text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px}
.sheet .thumb{aspect-ratio:16/9}
.sheet .thumb svg{width:22%}
.sheet-close{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:22px;line-height:1}
.sheet-body{padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.status{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.status.win{background:var(--win-bg);color:var(--win)}
.status.out{background:var(--out-bg);color:var(--out)}
.status.closed{background:var(--surface-2);color:var(--muted)}
.pricebox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pricebox div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pricebox b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1}
.pricebox span{font-size:12px;color:var(--muted)}
.bidform{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.money-in{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--bg);overflow:hidden}
.money-in span{padding:0 4px 0 14px;font-family:var(--f-display);font-size:24px;font-weight:800}
.money-in input{border:0;background:none;padding:10px 12px 10px 2px;font-family:var(--f-display);font-size:24px;font-weight:800;width:100%;min-width:0;outline:none}
.err{color:var(--out);font-size:13px;font-weight:600}
details.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
details.how summary{font-weight:700;cursor:pointer}
.hist .row{font-size:13.5px}
.modal{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}

/* Toasts */
.toasts{position:fixed;z-index:80;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;width:100%;max-width:560px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:14px;animation:tin .25s ease-out}
.toast.outbid{background:var(--out);color:#fff}
.toast.win{background:var(--win);color:#fff}
.toast .tt{flex:1;min-width:0}
.toast .tt small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;opacity:.8}
.toast button{border:1px solid currentColor;background:none;color:inherit;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;flex-shrink:0}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{0%{background:var(--accent)}100%{background:transparent}}
.flash{animation:flash 1s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Registration */
.reg{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.reg h1{font-size:30px;line-height:1.05}
.oauth{display:flex;flex-direction:column;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (min-width:720px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} .wrap{max-width:760px} .eventbar-in,.nav-in{max-width:760px} }
@media (min-width:1000px){ body.admview .wrap{max-width:1180px} body.admview .eventbar-in,body.admview .nav-in{max-width:1180px} }
</style>

<style>body:not(.ok)>*{visibility:hidden}body:not(.ok){background:#1D4766}</style>

<style>
.bidform{display:flex;flex-direction:column;gap:12px}
.bidmain{display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;align-items:stretch}
.stepper .btn{font-size:24px;padding:0;min-height:56px}
.stepper .money-in input{text-align:center;padding-left:0}
.stepper .money-in span{padding-left:14px}
.maxform{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:12px;padding:12px}
.money-in.sm{border-width:1.5px}
.money-in.sm span,.money-in.sm input{font-size:20px}
.bidform .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.bidform .or::before,.bidform .or::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
<style>
.lotthumb{width:96px;height:96px}
.scr-lot .lotrow{display:grid;grid-template-columns:clamp(110px,13vw,260px) minmax(0,1fr);gap:1.4vw;align-items:center}
.scr-lot .pimg{border-radius:14px;background:#F2F3F5}
.scr-lot .t{font-size:clamp(18px,2vw,38px);font-weight:700;line-height:1.15}
.scr-lot .s{font-size:clamp(13px,1.2vw,22px);color:#A9B6CC;margin-top:.4vw}
.scr-lot .soldto{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,58px);color:#F2B92B;margin-top:.4vw}
.scr-lot.sold{border-color:rgba(242,185,43,.6);box-shadow:0 0 0 2px rgba(242,185,43,.25)}
</style>
<style>
/* Fund-a-Need */
.fan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fan h2{font-size:18px;line-height:1.2}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#E8B23A);transition:width .6s ease}
.amt-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.amt-chips .chip{padding:12px;font-size:16px;border-radius:12px;text-align:center}

/* Admin sub-tabs */
.adm-tabs{display:flex;width:100%;overflow-x:auto;scrollbar-width:none}
.adm-tabs button{flex:1 0 auto;padding:9px 12px;font-size:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.formgrid .full{grid-column:1/-1}
@media (max-width:420px){ .formgrid{grid-template-columns:1fr} }
.field .hint{font-weight:400;color:var(--muted);font-size:12px}
.pv{font-size:12.5px}
.pv td,.pv th{white-space:nowrap}
.okc{color:var(--win);font-weight:600} .badc{color:var(--out);font-weight:600}

/* Reports */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile.hero{grid-column:1/-1;background:var(--btn);color:var(--btn-fg)}
.tile.hero b{font-size:38px} .tile.hero span{color:inherit;opacity:.8}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ---------- Event catalog: the items copied into each test run ---------- */
const CATS={travel:"Travel",dining:"Dining",sports:"Sports",home:"Home",kids:"Kids",exp:"Experiences"};
let CATALOG=[];
const BOTS=[
 {id:"bot-sarah",name:"Sarah K.",paddle:912,bot:true},
 {id:"bot-marcus",name:"Marcus T.",paddle:918,bot:true},
 {id:"bot-dana",name:"Dana R.",paddle:924,bot:true},
 {id:"bot-jim",name:"Pastor Jim",paddle:931,bot:true}
];
const ICONS={
 travel:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 36h36M10 30l6-14 8 6 8-12 10 20"/><circle cx="35" cy="11" r="3.5"/></svg>',
 dining:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M14 6v14a5 5 0 0 0 10 0V6M19 6v36M33 42V6c-4 3-6 9-6 15h6"/></svg>',
 sports:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="24" cy="24" r="16"/><path d="M13 12c4 7 4 17 0 24M35 12c-4 7-4 17 0 24" stroke-linecap="round"/></svg>',
 home:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M8 22L24 9l16 13v18H8z"/><path d="M8 30h32M16 22v18M24 22v18M32 22v18"/></svg>',
 kids:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M24 6l5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1z"/></svg>',
 exp:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M24 6c-8 0-13 6-13 13 0 8 8 13 10 17h6c2-4 10-9 10-17 0-7-5-13-13-13z"/><path d="M21 36v6h6v-6M24 6v30"/></svg>'
};
const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';

/* ---------- Helpers ---------- */
let OFFSET=0;
const now=()=>Date.now()+OFFSET;  // server clock, so every phone counts down together
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const inc=p=>p<100?5:p<500?10:p<1000?25:50;
const tClock=t=>new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
function fmt(ms){ if(ms<=0) return "0:00"; const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`; }
const lsGet=k=>{ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };

/* ---------- State ----------
   S mirrors the auction (shared store or this device).
   L is per-viewer: who you're bidding as, watchlist, alert inbox. */
let MODE=null, sb=null, myUid=null, isAdmin=false, canWrite=true, botHost=false;
const clientId=rid();
const S={meta:null,items:{},people:{},orders:{},anns:{},feedback:{},photos:{},catalog:{},config:null,donations:{},drawings:{},pools:{},maxes:[],hist:{}};
let L={acting:null,watch:{},inbox:[],seenAnn:{},reminded:{}};
const ui={view:"browse",sheet:null,cat:"all",filter:"all",sort:"closing",q:"",layout:"grid",err:"",confirm:null,aud:"all",ann:"",don:0,fee:true,card:"4242",paying:false,busy:false,resetConfirm:false,binConfirm:false,live:{},closing:{},lDur:10};
const LKEY=()=>"ctc-auction-viewer-"+MODE;
const saveL=()=>lsSet(LKEY(),L);
const saveLocal=()=>{ if(MODE==="local") lsSet("ctc-auction-local-v2",S); };

const run=()=>S.meta?S.meta.run:0;
const items=()=>Object.values(S.items).filter(i=>i.run===run()).map(withCat).sort((a,b)=>a.no-b.no);
const item=id=>S.items[id]&&withCat(S.items[id]);
const person=id=>S.people[id]||{name:"Bidder",paddle:"?"};
const me=()=>L.acting;
const registered=()=>!!S.people[myUid];
const phase=()=>!S.meta?"none":S.meta.phase==="paused"?"paused":items().some(i=>!i.live)&&items().filter(i=>!i.live).every(i=>i.closed)?"closed":"live";
function remaining(it){ const ref=S.meta&&S.meta.phase==="paused"?S.meta.pausedAt:now(); return it.endsAt-ref; }
function isOpen(it){ return !it.closed && remaining(it)>0; }

/* ---------- Server calls (Supabase) ---------- */
const NET_ERR="Couldn't reach the auction. Check your connection and try again.";
function friendly(e){ const m=(e&&e.message)||""; if(/Only auction admins|Enter your name|isn't open yet|Bidding opens/.test(m)) return m; return "The auction server didn't accept that. Please try again."; }
async function rpc(fn,args){
  try{ const {data,error}=await sb.rpc(fn,args||{}); if(error) return {err:friendly(error)};
    return (data&&typeof data==="object"&&!Array.isArray(data))?data:{ok:true,data}; }
  catch(e){ return {err:NET_ERR}; }
}
async function insertRow(table,row,ignoreDup){
  try{ const t=sb.from(table); const {error}=await (ignoreDup?t.upsert(row,{onConflict:"id",ignoreDuplicates:true}):t.insert(row));
    return error?{err:friendly(error)}:{}; }
  catch(e){ return {err:NET_ERR}; }
}

/* ---------- Bid minimum shown on screen (the server enforces the real rules) ---------- */
function minNext(it,uid){
  const mine=it.maxes.find(m=>m.u===uid);
  if(uid && it.leader===uid && mine) return mine.max+inc(mine.max);
  return it.bidCount?it.price+inc(it.price):it.start;
}

/* ---------- Actions ---------- */
async function placeBid(id,uid,max,opt){ return rpc("place_bid",{p_item:id,p_uid:uid,p_max:Math.floor(Number(max))||0,p_kind:(opt&&opt.kind)||"max"}); }
async function buyNow(id,uid){ return rpc("buy_now",{p_item:id,p_uid:uid}); }
async function launch(){ return rpc("admin_launch",{p_dur:ui.lDur}); }

/* ---------- Alerts (each viewer works out its own from what changed) ---------- */
function alertMe(kind,text,itemId,quiet){
  L.inbox.push({id:rid(),kind,text,item:itemId||null,t:now(),read:false,run:run()});
  if(L.inbox.length>120) L.inbox.splice(0,L.inbox.length-120);
  saveL(); if(!quiet) toast(text,kind,itemId);
}
function onItems(before){
  const m=me();
  Object.values(S.items).forEach(n=>{
    const p=before[n.id]; if(!p||p.run!==n.run) return;
    if(n.price!==p.price) ui.live[n.id]=now();
    if(!m) return;
    const mine=n.maxes.find(x=>x.u===m);
    if(p.leader===m && n.leader!==m && !n.closed && mine)
      alertMe("outbid",`You've been outbid on ${n.title}! Current bid: ${money(n.price)}. Your maximum bid was ${money(mine.max)}. Tap to raise your maximum and stay in the running.`,n.id);
    else if(p.leader===m && n.leader===m && n.price>p.price && !n.closed)
      alertMe("lead",`Someone bid on ${n.title}, but your maximum kept you in the lead. Current bid: ${money(n.price)}.`,n.id);
    if(!p.closed && n.closed){
      if(n.winner===m) alertMe("win",`You won ${n.title} for ${money(n.final)}! Go to Checkout to complete your test payment.`,n.id);
      else if(mine) alertMe("info",n.winner?`${n.title} has closed. Winning bid: ${money(n.final)}.`:`${n.title} closed without meeting its reserve.`,n.id);
    }
  });
  render();
}
function onAnns(first){
  Object.values(S.anns).filter(a=>a.run===run()).sort((a,b)=>a.t-b.t).forEach(a=>{
    const key=a.run+":"+a.id; if(L.seenAnn[key]) return; L.seenAnn[key]=1;
    if(a.aud.includes(myUid)||a.aud.includes(me())) alertMe("info","Announcement: "+a.text,null,first);
  });
  saveL();
}
function toast(text,kind,itemId){
  const box=document.getElementById("toasts"), el=document.createElement("div");
  el.className="toast "+(kind||"");
  const label=kind==="outbid"?"Outbid · Test alert":kind==="win"?"You won · Test alert":kind==="pay"?"Test payment":"Test alert";
  el.innerHTML=`<div class="tt"><small>${label}</small>${esc(text)}</div>${itemId&&kind!=="win"?`<button type="button">${kind==="outbid"?"Raise max":"View"}</button>`:""}`;
  const b=el.querySelector("button"); if(b) b.onclick=()=>{ openSheet(itemId); el.remove(); };
  box.prepend(el); while(box.children.length>3) box.lastChild.remove();
  setTimeout(()=>el.remove(),kind==="outbid"?7000:4500);
}

/* ---------- Simulated bidders: one open browser hosts them ---------- */
async function botLease(){ if(!sb||!myUid) return; const r=await rpc("take_lease",{p_name:"bots",p_holder:clientId,p_ttl:12000}); botHost=!!(r.ok&&r.data); }
setInterval(botLease,5000);
setInterval(async()=>{
  if(!botHost||!S.meta||!S.meta.settings.bots||phase()!=="live"||!canWrite) return;
  const open=items().filter(i=>isOpen(i)&&!i.live); if(!open.length) return;
  const closing=open.some(i=>remaining(i)<90000);
  if(Math.random()<(closing?0.25:0.5)) return;
  const it=open[Math.floor(Math.random()*open.length)];
  const bots=BOTS.filter(b=>b.id!==me()&&b.id!==it.leader); if(!bots.length) return;
  const b=bots[Math.floor(Math.random()*bots.length)];
  const cap=Math.floor(it.value*(0.85+Math.random()*0.45));
  const min=minNext(it,b.id); if(min>cap) return;
  if(Math.random()<0.5) await placeBid(it.id,b.id,min,{kind:"bid"});
  else await placeBid(it.id,b.id,Math.min(cap,min+inc(min)*Math.floor(Math.random()*5)),{kind:"max"});
},3200);

/* ---------- Clock: countdowns, reminders, closing ---------- */
function auctionLeft(){ const open=items().filter(i=>!i.closed&&!i.live); return open.length?Math.max(...open.map(remaining)):0; }
function tick(){
  const ph=phase();
  if(ph==="live"&&sb&&items().some(it=>!it.closed&&remaining(it)<=0)&&!(ui.closingAt>now())){
    ui.closingAt=now()+3000; setTimeout(()=>rpc("close_due").then(r=>{ if(r.data) refreshItems(); }),Math.random()*700);
  }
  if(ph==="live"&&me()){
    items().forEach(it=>{
      const key=run()+":"+it.id+":"+me();
      if(!it.closed&&!L.reminded[key]&&remaining(it)<=60000&&remaining(it)>0&&(it.maxes.some(m=>m.u===me())||(L.watch[me()]||[]).includes(it.id))){
        L.reminded[key]=1; alertMe("info",`${it.title} closes in under a minute. Current bid: ${money(it.price)}.`,it.id);
      }
    });
  }
  document.querySelectorAll("[data-ends]").forEach(el=>{
    const k=el.dataset.ends;
    if(k==="all") el.textContent=ph==="none"?"--:--":ph==="closed"?"Closed":fmt(auctionLeft());
    else { const it=item(k); if(it) el.textContent=it.closed?"Closed":remaining(it)<=0?"Closing…":fmt(remaining(it)); }
  });
  document.getElementById("clock").classList.toggle("paused",ph==="paused");
  document.getElementById("clocklbl").textContent=ph==="paused"?"Paused":ph==="closed"||ph==="none"?"Auction":"Closes in";
}
setInterval(tick,1000);

/* ---------- View helpers ---------- */
function myState(it,uid=me()){
  const mine=it.maxes.find(m=>m.u===uid);
  if(it.closed) return it.winner===uid?"won":mine?"lost":"closed";
  if(!mine) return null;
  return it.leader===uid?"winning":"outbid";
}
function pillFor(st){ return st==="winning"?'<span class="pill win">Winning</span>':st==="outbid"?'<span class="pill out">Outbid</span>':st==="won"?'<span class="pill win">You won</span>':st==="lost"||st==="closed"?'<span class="pill closed">Closed</span>':""; }
function watching(id){ return (L.watch[me()]||[]).includes(id); }
const photos=id=>(S.photos[id]&&S.photos[id].list)||[];
const blob=p=>p.startsWith("img/")?p:sb.storage.from("photos").getPublicUrl(p).data.publicUrl;
// A plain image tile: the item's main photo, or a quiet placeholder until one is added.
function tile(it,cls){
  const p=photos(it.id);
  return p.length?`<div class="pimg ${cls||""}" data-cat="${it.cat}"><img src="${blob(p[0])}" alt="${esc(it.title)}" loading="lazy"></div>`
    :`<div class="pimg ph ${cls||""}">${ICONS[it.cat]}</div>`;
}
// A photo that fails to load falls back to the placeholder instead of a broken-image icon.
document.addEventListener("error",e=>{
  const im=e.target; if(!im||im.tagName!=="IMG") return;
  const box=im.closest(".pimg,.slide"); if(!box) return;
  box.classList.add("ph"); im.replaceWith(document.createRange().createContextualFragment(ICONS[box.dataset.cat]||ICONS.exp));
},true);
function priceHTML(n,cls){
  const whole=Math.floor(n), cents=Math.round((n-whole)*100);
  return `<span class="px ${cls||""}"><sup>$</sup>${whole.toLocaleString("en-US")}${cents?`<sup>${String(cents).padStart(2,"0")}</sup>`:""}</span>`;
}
function tagFor(it){
  const st=myState(it);
  if(st==="won") return ["win","You won"];
  if(st==="winning") return ["win","You're winning"];
  if(st==="outbid") return ["out","Outbid"];
  if(it.closed) return ["closed",it.winner?"Sold":"Closed"];
  const top=Math.max(...items().filter(i=>!i.closed).map(i=>i.bidCount));
  if(it.bidCount&&it.bidCount===top) return ["best","Most bids"];
  if(it.live) return ["feat","Live auction"];
  if(it.featured) return ["feat","Featured"];
  return null;
}
const closingSoon=it=>!it.closed&&remaining(it)>0&&remaining(it)<180000;
function bidders(it){ return bidderIdsOf(it).length; }
const runOrders=()=>Object.values(S.orders).filter(o=>o.run===run());
function paidIds(uid){ const s=new Set(); runOrders().filter(o=>o.status==="paid"&&(!uid||o.u===uid)).forEach(o=>o.items.forEach(i=>s.add(i))); return s; }
const humans=()=>Object.entries(S.people).filter(([,p])=>!p.bot).map(([id,p])=>({id,...p}));

/* ---------- Views ---------- */
function vRegister(){
  return `<div class="reg">
   <span class="pill test">Committee test</span>
   <h1>Join the Called To Care Fall Auction</h1>
   <p class="muted">Takes under a minute. One account works for every future auction; you join each event separately.</p>
   <div class="oauth">
     <button class="btn block" type="button" data-act="oauth" data-p="Apple">Continue with Apple <span class="muted small">(demo)</span></button>
     <button class="btn block" type="button" data-act="oauth" data-p="Google">Continue with Google <span class="muted small">(demo)</span></button>
   </div>
   <div class="or">or use your phone or email</div>
   <form id="regform" class="sec">
     <label class="field">Name bidders will know you by<input id="r-name" autocomplete="name" required placeholder="First and last name" value="${esc(ui.prefill||"")}"></label>
     <label class="field">Mobile number or email<input id="r-contact" autocomplete="email" placeholder="For your one-time code"></label>
     <label class="field">Send bid alerts by<select id="r-pref"><option>Text message</option><option>Email</option><option>In-app only</option></select></label>
     <label class="check"><input type="checkbox" id="r-terms" required><span>I agree to the auction terms. Bids are binding commitments to pay.</span></label>
     <div class="err" id="r-err" hidden></div>
     ${canWrite?"":`<div class="note">Your access is view-only, so you can look around but not bid. Ask the organizer to share this auction with you as a Contributor.</div>`}
     <button class="btn primary block" type="submit" ${canWrite?"":"disabled"}>Join auction</button>
     <p class="small muted">Demo: no code is actually sent. Payment details are requested at checkout.</p>
   </form></div>`;
}
function vWaiting(){
  return `<section class="sec hero"><span class="pill test">Committee test</span><h2>The test auction hasn't started yet</h2>
    <p class="muted">${isAdmin?"Start a run when the committee is ready. Everyone with the link sees the same items, bids, and countdown.":"The organizer will start it shortly. This page updates on its own."}</p>
    ${isAdmin?launchControls():""}</section>${isAdmin?publicCard():""}${peopleSec()}`;
}
function launchControls(){
  return `<div class="row" style="align-items:flex-end;flex-wrap:wrap;width:100%">
    <label class="field" style="flex:1 1 160px">Test length<select id="dur">${[5,10,20,30,60].map(m=>`<option value="${m}" ${ui.lDur===m?"selected":""}>${m} minutes</option>`).join("")}</select></label>
    <button class="btn primary" type="button" data-act="launch" ${ui.busy?"disabled":""}>${ui.busy?"Starting…":"Launch test auction"}</button></div>`;
}
function peopleSec(){
  const h=humans();
  return `<section class="sec"><div class="row"><h2>Who's joined</h2><span class="muted num">${h.length}</span></div>
   ${h.length?`<div class="people">${h.sort((a,b)=>a.paddle-b.paddle).map(p=>`<span class="person"><b>#${p.paddle}</b>${esc(p.name)}${p.id===myUid?" (you)":""}</span>`).join("")}</div>`:`<p class="small muted">Committee members appear here as they join.</p>`}</section>`;
}

function vBrowse(){
  if(!items().length) return vWaiting();
  const all=items(), st=all.map(i=>myState(i));
  const win=st.filter(x=>x==="winning").length, out=st.filter(x=>x==="outbid").length;
  const soon=(L.watch[me()]||[]).map(item).filter(i=>i&&isOpen(i)&&remaining(i)<5*60000).length;
  let list=all.slice();
  if(ui.cat!=="all") list=list.filter(i=>i.cat===ui.cat);
  const f=ui.filter;
  if(f==="live") list=list.filter(i=>i.live);
  if(f==="nobids") list=list.filter(i=>!i.bidCount);
  if(f==="mine") list=list.filter(i=>i.maxes.some(m=>m.u===me()));
  if(f==="watch") list=list.filter(i=>watching(i.id));
  if(f==="winning") list=list.filter(i=>myState(i)==="winning");
  if(ui.q){ const q=ui.q.toLowerCase(); list=list.filter(i=>(i.title+" "+i.desc+" "+i.no).toLowerCase().includes(q)); }
  const so={closing:(a,b)=>(a.closed-b.closed)||(a.endsAt-b.endsAt)||a.no-b.no,high:(a,b)=>b.price-a.price,low:(a,b)=>a.price-b.price,bids:(a,b)=>b.bidCount-a.bidCount,az:(a,b)=>a.title.localeCompare(b.title),num:(a,b)=>a.no-b.no};
  list.sort(so[ui.sort]);
  const chip=(k,l,g)=>`<button class="chip" type="button" data-act="${g}" data-v="${k}" aria-pressed="${ui[g]===k}">${l}</button>`;

function vMine(){

  const watch=(L.watch[me()]||[]).map(item).filter(i=>i&&i.run===run()&&!i.maxes.some(m=>m.u===me()));
  const paid=paidIds(me());
  const row=(i,extra)=>{ const m=i.maxes.find(x=>x.u===me());
    return `<div class="row" role="button" tabindex="0" data-act="open" data-id="${i.id}" style="cursor:pointer">
      <div class="mrow">${tile(i,"mthumb")}<div><div style="font-weight:600;line-height:1.3">${esc(i.title)}</div><div class="small muted num">${m?`Your max ${money(m.max)} · `:""}${i.closed?"Closed":`<span data-ends="${i.id}">${fmt(remaining(i))}</span> left`}</div></div></div>
      <div style="text-align:right;flex-shrink:0">${priceHTML(i.final||i.price)}<div>${extra||""}</div></div></div>`; };
  const sec=(t,arr,empty,extra)=>`<section class="sec"><div class="row"><h2>${t}</h2><span class="muted num">${arr.length}</span></div>${arr.length?`<div class="rows">${arr.map(i=>row(i,extra&&extra(i))).join("")}</div>`:`<p class="muted small">${empty}</p>`}</section>`;

function vAlerts(){

function audience(k){
  const ids=Object.keys(S.people), all=items();
  const bidders=new Set(all.flatMap(bidderIdsOf)), paid=paidIds();
  const f={all:()=>ids,bid:()=>ids.filter(u=>bidders.has(u)),nobid:()=>ids.filter(u=>!bidders.has(u)),
    winning:()=>ids.filter(u=>all.some(i=>!i.closed&&i.leader===u)),
    outbid:()=>ids.filter(u=>all.some(i=>!i.closed&&i.leader!==u&&bidderIdsOf(i).includes(u))),
    unpaid:()=>ids.filter(u=>all.some(i=>i.winner===u&&!paid.has(i.id))||runDons().some(d=>d.uid===u&&!paidDonIds(u).has(d.id)))};
  return f[k]();
}
function stats(){
  const all=items(), o=runOrders();
  return {bids:all.reduce((a,i)=>a+i.bidCount,0),proxy:all.reduce((a,i)=>a+i.proxyCount,0),outbid:all.reduce((a,i)=>a+i.outbids,0),ext:all.reduce((a,i)=>a+i.ext,0),
    payOk:o.filter(x=>x.status==="paid"&&x.card!=="manual").length,payFail:o.filter(x=>x.status==="failed").length,
    ann:Object.values(S.anns).filter(a=>a.run===run()).length};
}
function report(){
  const st=stats(), all=items(), sold=all.filter(i=>i.winner);
  const rev=runOrders().filter(o=>o.status==="paid").reduce((a,o)=>a+o.total,0);
  return [`CALLED TO CARE · TEST AUCTION REPORT (run ${run()})`,
   `Started ${new Date(S.meta.launchedAt).toLocaleString()} · ${S.meta.dur} minute test`,
   `Participants: ${humans().length} committee + ${BOTS.length} simulated`,
   `Bids placed: ${st.bids} · automatic bids: ${st.proxy}`,
   `Times someone was outbid: ${st.outbid} · soft-close extensions: ${st.ext}`,
   `Items closed: ${all.filter(i=>i.closed).length}/${all.length} · sold: ${sold.length}`,
   `Simulated winning total: ${money(sold.reduce((a,i)=>a+i.final,0))}`,
   `Test payments: ${st.payOk} succeeded, ${st.payFail} declined · collected ${money(rev)}`,
   `Announcements sent: ${st.ann}`,
   `Committee feedback reports (all runs): ${Object.keys(S.feedback).length}`,
   `No real money was charged. No real messages were sent.`].join("\n");
}

  </div></div>`;

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.86));
  } finally { URL.revokeObjectURL(url); }
}
async function savePhotos(id,list){ const r=await rpc("admin_set_photos",{p_item:id,p_list:list}); if(!r.err) S.photos[id]={list}; return r; }
async function addPhotos(files){
  const id=ui.pm; if(!isAdmin||!files.length) return;
  ui.pmBusy=true; ui.pmMsg=""; renderPM();
  let list=photos(id).slice(), done=0, failed=0, why="";
  for(const f of files){
    ui.pmMsg=`Uploading ${done+failed+1} of ${files.length}…`; renderPM();
    try{
      const b=await compress(f); if(!b) throw new Error("read");
      const path=`${id}/${Date.now()}-${rid()}.jpg`;
      const {error}=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg",cacheControl:"31536000"});
      if(error) throw new Error("upload");
      list.push(path); const s=await savePhotos(id,list); if(s.err) throw new Error("save");
      done++;
    }catch(e){ failed++; why=e.message==="read"?"A photo couldn't be read. Try a JPEG or PNG.":"The upload didn't finish. Check your connection and try again."; }
  }
  ui.pmBusy=false;
  ui.pmMsg=failed?`${done} added, ${failed} didn't upload. ${why}`:`${done} photo${done===1?"":"s"} added.`;
  renderPM(); render();
}
async function submitBid(v,kind){

async function pay(){
  if(ui.paying) return;
  const {items:due,pledges}=dueFor(me()); if(!due.length&&!pledges.length) return;
  const sub=due.reduce((a,i)=>a+i.final,0), pl=pledges.reduce((a,d)=>a+d.amount,0), don=ui.don, fee=ui.fee?Math.round((sub+pl+don)*0.03*100)/100:0;
  ui.paying=true; render();
  await sleep(1200);
  // The order id doubles as the idempotency key: paying the same balance twice records one payment.
  const key="ORD-"+run()+"-"+person(me()).paddle+"-"+[...due.map(i=>i.no),...pledges.map(d=>d.id.slice(1,5))].join("-");
  const base={run:run(),u:me(),items:due.map(i=>i.id),dons:pledges.map(d=>d.id),pledged:pl,don,fee,total:Math.round((sub+pl+don+fee)*100)/100,t:now(),card:ui.card};
  let r;

    r=await API.saveOrder({...base,id:key+"-F"+rid().slice(0,4),status:"failed"});
    if(!r.err) alertMe("pay","Test payment declined. No money was charged. Try another test card.");
  } else {
    r=await API.saveOrder({...base,id:key,status:"paid",code:"P"+person(me()).paddle+"-"+rid().slice(0,3).toUpperCase()});
    if(!r.err){ ui.don=0; alertMe("pay","TEST PAYMENT SUCCESSFUL — NO MONEY WAS CHARGED. Your tax receipt is ready."); }
  }

}

const IMPORT_COLS={no:["item #","item number","item no","number","no","#","lot","lot #"],title:["title","item","item name","name"],cat:["category","cat"],mode:["auction type","type","live or silent","live/silent","mode","auction"],
  value:["fair market value","value","fmv","retail value","estimated value","est value"],start:["starting bid","start","opening bid","minimum bid","min bid"],
  reserve:["reserve","reserve price"],bin:["buy it now","buy now","bin","buy it now price"],donor:["donor","donated by","donor name"],
  desc:["description","details","desc"],pickup:["pickup","pickup instructions","delivery","pickup or delivery","pickup/delivery"],featured:["featured"]};
const IMPORT_TEMPLATE='Item #,Title,Auction type,Category,Fair market value,Starting bid,Reserve,Buy it now,Donated by,Description,Pickup,Featured\n11,Wine Tasting for Eight,Silent,Dining,400,100,,,"Vine & Barrel","A private guided tasting of six wines with cheese pairings.",Certificate emailed after checkout.,no\n12,Week at a Florida Beach House,Live,Travel,3000,1000,,,The Morgans,Seven nights for up to eight guests.,Certificate emailed after checkout.,no\n';
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(f); f=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=ch;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function catFromText(t){
  const s=String(t||"").toLowerCase();
  if(/travel|trip|getaway|vacation|hotel/.test(s)) return "travel";
  if(/din|food|restaurant|meal|wine|pizza|bake|pie/.test(s)) return "dining";
  if(/sport|golf|ticket|game/.test(s)) return "sports";
  if(/home|decor|garden|quilt|furniture/.test(s)) return "home";
  if(/kid|child|camp|family|youth/.test(s)) return "kids";
  return "exp";
}
function importRows(text){
  const rows=parseCSV(text); if(rows.length<2) return {err:"Add a header row and at least one item."};
  const head=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9#/ ]/g,"").replace(/\s+/g," ").trim());
  const map={}; Object.entries(IMPORT_COLS).forEach(([k,names])=>{ const i=head.findIndex(h=>names.includes(h)); if(i>=0) map[k]=i; });
  if(map.title===undefined) return {err:"Couldn't find a Title column. Copy the template to see the expected headings."};
  const existing=catList(); let next=Math.max(0,...existing.map(c=>c.no))+1;
  const out=rows.slice(1).map((r,idx)=>{
    const get=k=>map[k]===undefined?"":String(r[map[k]]||"").trim();
    const n=num(get("no")), byNo=existing.find(c=>c.no===Math.round(n));
    const opt=k=>{ const v=num(get(k)); return isNaN(v)||v===0?null:Math.round(v); };
    const c={id:byNo?byNo.id:"i"+Date.now().toString(36)+idx,no:isNaN(n)?next++:Math.round(n),title:get("title"),cat:catFromText(get("cat")||get("title")),
      value:Math.round(num(get("value"))),start:Math.round(num(get("start"))),reserve:opt("reserve"),bin:opt("bin"),donor:get("donor"),desc:get("desc"),
      pickup:get("pickup")||"Certificate emailed after checkout.",featured:/^(y|yes|true|1|x)$/i.test(get("featured")),mode:/live/i.test(get("mode"))?"live":byNo&&!get("mode")?(byNo.mode||"silent"):"silent"};
    if(isNaN(c.value)) c.value=0;
    return {c,update:!!byNo,err:""};
  });
  const seen={}; out.forEach(o=>{ o.err=validateItem(o.c,existing.filter(x=>x.id!==o.c.id)); if(!o.err&&seen[o.c.no]) o.err=`Item # ${o.c.no} appears twice.`; seen[o.c.no]=1; });
  return {rows:out};
}

  </div></div>`;

async function readImportFile(file){
  const m=ui.imp; m.err="";
  try{
    if(/\.xlsx?$/i.test(file.name)){
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array"});
      m.text=window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]);
    } else m.text=await file.text();
    const r=importRows(m.text); m.rows=r.rows||null; m.err=r.err||"";
  }catch(e){ m.err="That file couldn't be read. Save it as CSV and try again."; }
  renderImport();
}
async function runImport(){
  const m=ui.imp, ok=m.rows.filter(r=>!r.err); m.busy=true; m.done=0; renderImport();
  for(const r of ok){ const res=await API.saveItem(r.c,!r.update); if(res.err){ m.err=`Stopped at item ${r.c.no}: ${res.err}`; break; } m.done++; renderImport(); }
  m.busy=false;
  if(!m.err){ closeSheet(); toast(`${m.done} item${m.done===1?"":"s"} imported.`,"info"); render(); } else renderImport();
}

function reportData(){
  const all=items(), sold=all.filter(i=>i.winner&&i.how!=="golden"), orders=runOrders(), paidO=orders.filter(o=>o.status==="paid");
  const dons=runDons(), paidItems=paidIds(), paidDons=paidDonIds();
  const itemSales=sold.reduce((a,i)=>a+i.final,0), gifts=dons.reduce((a,d)=>a+d.amount,0);
  const extra=paidO.reduce((a,o)=>a+(o.don||0),0), fees=paidO.reduce((a,o)=>a+(o.fee||0),0);
  const collected=paidO.reduce((a,o)=>a+o.total,0);
  const outstanding=sold.filter(i=>!paidItems.has(i.id)).reduce((a,i)=>a+i.final,0)+dons.filter(d=>!paidDons.has(d.id)).reduce((a,d)=>a+d.amount,0);
  const valueSold=sold.reduce((a,i)=>a+i.value,0), liveSales=sold.filter(i=>i.live).reduce((a,i)=>a+i.final,0);
  return {all,sold,orders,paidO,dons,paidItems,paidDons,itemSales,liveSales,gifts,extra,fees,collected,outstanding,valueSold,total:itemSales+gifts+extra+fees};
}
function activityChart(){
  const h=historyAll().filter(x=>!x.auto); if(!S.meta||!h.length) return `<p class="small muted" style="margin:0">Bids will chart here as they come in.</p>`;
  const t0=S.meta.launchedAt, t1=Math.max(...h.map(x=>x.t),t0+60000);
  const step=Math.max(60000,Math.ceil((t1-t0)/24/60000)*60000), n=Math.ceil((t1-t0)/step)||1;
  const counts=Array(n).fill(0); h.forEach(x=>{ const k=Math.min(n-1,Math.max(0,Math.floor((x.t-t0)/step))); counts[k]++; });
  const max=Math.max(...counts), top=Math.max(4,Math.ceil(max/4)*4);
  const W=600,H=200,L=34,R=8,T=10,B=26, cw=(W-L-R)/n, bw=Math.max(2,cw-2);
  const y=v=>T+(H-T-B)*(1-v/top);
  const grid=[0,top/2,top].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
  const bars=counts.map((c,k)=>{ if(!c) return ""; const x=L+k*cw+1, yy=y(c), hh=H-B-yy, r=Math.min(4,bw/2,hh);
    return `<path d="M${x},${H-B} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${H-B} Z" fill="var(--link)" data-tip="${c} bid${c===1?"":"s"} · ${tClock(t0+k*step).replace(/:\d\d(?=\s|$)/,"")}"/>`; }).join("");
  const lbl=k=>`<text x="${L+k*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${new Date(t0+k*step).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</text>`;
  return `<div class="chart" id="actchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bids per ${step/60000} minute${step>60000?"s":""}, peak ${max}">${grid}${bars}${lbl(0)}${n>2?lbl(Math.floor(n/2)):""}${n>1?lbl(n-1):""}</svg><div class="tip" id="acttip"></div></div>
    <p class="small muted" style="margin:0">Bids per ${step/60000===1?"minute":step/60000+" minutes"}, not counting automatic bids.</p>`;
}

function boardSummary(d){

    `Total raised: ${money(d.total)} (${money(d.collected)} collected, ${money(d.outstanding)} still owed).`,
    `Auction sales: ${money(d.itemSales)} from ${d.sold.length} of ${d.all.length} items, ${d.valueSold?Math.round(d.itemSales/d.valueSold*100):0}% of their combined fair market value.`,

    top.length?`Top items: ${top.map(i=>`${i.title} (${money(i.final)})`).join("; ")}.`:"",
    best?`Best value for the mission: ${best.title}, which sold for ${Math.round(best.final/best.value*100)}% of its value.`:"",

}

/* =====================================================================
   Raffles, Golden Tickets and bucket prizes (drawn by hand, recorded here)
   ===================================================================== */
const DRAW_KINDS={raffle:"Raffle",golden:"Golden Ticket",bucket:"Bucket prize"};
const drawList=()=>Object.values(S.drawings||{}).sort((a,b)=>(a.kind===b.kind?0:a.kind==="golden"?-1:b.kind==="golden"?1:a.kind==="raffle"?-1:1)||a.no-b.no||a.name.localeCompare(b.name));
const poolFor=kind=>kind==="golden"?"golden":kind==="raffle"?"raffle":null;
function poolRows(pool){ return ((S.pools||{})[pool]||{}).rows||[]; }
function findTicket(pool,n){ const t=Number(n); return poolRows(pool).find(r=>t>=r.from&&t<=r.to); }
function poolStats(pool){ const rows=poolRows(pool); return {tickets:rows.reduce((a,r)=>a+(r.to-r.from+1),0),buyers:new Set(rows.map(r=>r.name.toLowerCase())).size,amount:rows.reduce((a,r)=>a+(r.amount||0),0),rows:rows.length}; }
// IRS Form W-2G: raffle winnings of $600+ that are at least 300 times the ticket price, and withholding on winnings over $5,000.
function w2g(d){ const v=Number(d.value)||0, p=Number(d.price)||0; return (v-p>=600&&(!p||v>=300*p))||v-p>5000; }
function currentDraw(){ const l=drawList(); if(!l.length) return null; const want=ui.draw||(S.meta&&S.meta.drawing); return l.find(d=>d.id===want)||l.find(d=>!d.winner)||l[l.length-1]; }
function drLookup(d){
  const t=String(ui.drTicket||"").replace(/\D/g,""), pool=poolFor(d.kind);
  if(!t) return {html:'<span class="muted">Type the number on the ticket you drew.</span>',row:null};
  if(!pool) return {html:'<span class="muted">Bucket stubs aren\'t in a list. Enter the name written on the stub.</span>',row:null};
  if(!poolRows(pool).length) return {html:`<span class="muted">No ${DRAW_KINDS[d.kind]} list imported yet. Enter the name on the stub.</span>`,row:null};
  const row=findTicket(pool,t);

const POOL_COLS={from:["ticket","ticket #","ticket number","tickets","ticket numbers","number","#","first ticket","from","start"],to:["last ticket","to","through","end"],
  name:["name","buyer","purchaser","sold to","full name","buyer name"],first:["first name","first"],last:["last name","last"],paddle:["bidder #","bidder","paddle","bidder number","paddle #"],amount:["amount","paid","price","total","amount paid"]};
function parsePool(text){
  const rows=parseCSV(text); if(rows.length<2) return {err:"Add a header row and at least one buyer."};
  const head=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9#/ ]/g,"").replace(/\s+/g," ").trim());
  const map={}; Object.entries(POOL_COLS).forEach(([k,names])=>{ const i=head.findIndex(h=>names.includes(h)); if(i>=0) map[k]=i; });
  if(map.from===undefined) return {err:"Couldn't find a Ticket # column."};
  if(map.name===undefined&&map.first===undefined) return {err:"Couldn't find a Name column."};
  const out=[], bad=[]; const seen=new Map();
  rows.slice(1).forEach((r,i)=>{
    const get=k=>map[k]===undefined?"":String(r[map[k]]||"").trim();
    const name=(get("name")||[get("first"),get("last")].filter(Boolean).join(" ")).slice(0,60);
    const paddle=Number(get("paddle").replace(/\D/g,""))||null, amount=num(get("amount"));
    const spec=get("from"), toCol=get("to"); const ranges=[];
    if(toCol&&/^\d+$/.test(spec)&&/^\d+$/.test(toCol)) ranges.push([+spec,+toCol]);
    else spec.split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(p=>{ const m=p.match(/^(\d+)\s*(?:-|–|to|thru|through)\s*(\d+)$/i); if(m) ranges.push([+m[1],+m[2]]); else if(/^\d+$/.test(p)) ranges.push([+p,+p]); });
    if(!name||!ranges.length){ bad.push(i+2); return; }
    ranges.forEach(([a,b],k)=>{ const from=Math.min(a,b), to=Math.max(a,b); if(to-from>5000){ bad.push(i+2); return; }
      for(const [f,t] of seen) if(from<=t&&to>=f){ bad.push(i+2); return; }
      seen.set(from,to); out.push({from,to,name,paddle,amount:k===0&&!isNaN(amount)?amount:0}); });
  });
  return {rows:out,bad};
}

async function readPoolFile(file){
  const m=ui.pimp; m.err="";
  try{
    if(/\.xlsx?$/i.test(file.name)){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array"}); m.text=window.XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]); }
    else m.text=await file.text();
    const r=parsePool(m.text); m.rows=r.rows||null; m.bad=r.bad||[]; m.err=r.err||"";
  }catch(e){ m.err="That file couldn't be read. Save it as CSV and try again."; }
  renderPoolImport();
}

function capture(root){

  const a=document.activeElement; if(a&&a.id&&root.contains(a)) out.__f={id:a.id,s:a.selectionStart,e:a.selectionEnd};
  return out;
}
function restore(root,st){
  Object.keys(st).forEach(id=>{ if(id==="__f") return; const el=root.querySelector("#"+id); if(el) el.value=st[id]; });
  if(st.__f){ const el=root.querySelector("#"+st.__f.id); if(el){ el.focus(); try{ el.setSelectionRange(st.__f.s,st.__f.e); }catch(e){} } }
}

  const id=e.target.id;
  if(id==="q"||id==="hq"){ ui.q=e.target.value; if(id==="hq"&&ui.view!=="browse"){ ui.view="browse"; closeSheet(); } render(); }
  if(id==="bidin"){ const n=Math.floor(Number(e.target.value.replace(/[^0-9]/g,"")))||0; ui.bidAmt=n; if(ui.confirm){ ui.confirm=null; return renderSheet(); }
    const b=document.getElementById("bidbtn"); if(b) b.textContent=n?`Place bid · ${money(n)}`:"Place bid"; }
  if(id==="ann"){ ui.ann=e.target.value; const b=document.querySelector('[data-act="send"]'); if(b) b.disabled=!(ui.ann.trim()&&audience(ui.aud).length); }
});
document.addEventListener("change",e=>{
  const t=e.target, id=t.id;
  const setMeta=patch=>rpc("admin_settings",{p:patch}).then(()=>loadAll());
  if(id==="sort"){ ui.sort=t.value; render(); }
  if(id==="hcat"){ ui.cat=t.value; ui.view="browse"; closeSheet(); render(); }
  if(id==="switchme"){ L.acting=t.value; saveL(); closeSheet(); render(); toast(`Now bidding as ${person(me()).name}.`,"info"); }
  if(id==="dur"){ ui.lDur=+t.value; }
  if(id==="softwin") setMeta({softWin:+t.value});
  if(id==="softext") setMeta({softExt:+t.value});
  if(id==="botscb") setMeta({bots:t.checked});
  if(id==="aud"){ ui.aud=t.value; render(); }
  if(id==="feecb"){ ui.fee=t.checked; render(); }
  if(id==="cardsel"){ ui.card=t.value; }
  if(id==="photoin"){ const f=[...t.files]; t.value=""; addPhotos(f); }
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="bidform"){ const v=document.getElementById("bidin").value.replace(/[^0-9.]/g,""); if(!v){ ui.err="Enter your bid."; renderSheet(); return; } submitBid(v,"bid"); }
  if(e.target.id==="maxform"){ const v=document.getElementById("maxin").value.replace(/[^0-9.]/g,""); if(!v){ ui.maxErr="Enter your maximum bid."; renderSheet(); return; } submitBid(v,"max"); }
  if(e.target.id==="admform"){
    const code=document.getElementById("admcode").value; if(!code) return;
    const r=await rpc("become_admin",{p_code:code});
    if(r.ok&&r.data){ isAdmin=true; ui.admErr=""; document.getElementById("admcode").value=""; await loadAll(); toast("Admin unlocked on this device.","info"); }
    else ui.admErr=r.err||"That code didn't match. Check with the organizer.";
    render(); return;
  }
  if(e.target.id==="regform"){ const n=document.getElementById("r-name").value.trim(); if(n) register(n); }
  if(e.target.id==="fbform"){
    const txt=document.getElementById("fbtext").value.trim(); if(!txt) return;
    const fid=rid(); closeSheet();
    const r=await insertRow("feedback",{id:fid,text:txt,page:ui.fbPage||"",device:device(),who:registered()?person(myUid).name:"Guest",t:now(),run:run()});
    toast(r.err||"Thanks. Your report was sent to the auction team.",r.err?"outbid":"info");
  }
});
async function register(name){
  const r=await rpc("join_auction",{p_name:name});
  if(r.err){ const er=document.getElementById("r-err"); if(er){ er.hidden=false; er.textContent=r.err; } return; }
  await loadPeople(); L.acting=myUid; saveL(); ui.view=ui.adminLink?"admin":"browse"; render();
  toast(`Welcome, ${name}! You're bidder #${r.data}.`,"info");
}
/* ---------- Loading data from Supabase ---------- */
function loadL(){ L=Object.assign({acting:null,watch:{},inbox:[],seenAnn:{},reminded:{}},lsGet(LKEY())||{}); }
async function q(table,build){ const {data,error}=await build(sb.from(table)); if(error) throw error; return data||[]; }
function mapItem(row){
  const c=S.catalog[row.id]||{};
  return {id:row.id,no:c.no,title:c.title||row.id,cat:c.cat||"exp",value:c.value||0,start:c.start||0,reserve:c.reserve,bin:c.bin,featured:c.featured,
    desc:c.desc||"",donor:c.donor||"",pickupText:c.pickup||"",
    run:row.run,price:row.price,leader:row.leader,endsAt:Number(row.ends_at),closed:row.closed,winner:row.winner,final:row.final,how:row.how,
    bidCount:row.bid_count,proxyCount:row.proxy_count,outbids:row.outbids,ext:row.ext,bidderIds:row.bidder_ids||[],pickup:row.pickup,live:row.live,
    maxes:S.maxes.filter(m=>m.item_id===row.id).map(m=>({u:m.uid,max:m.max,t:Number(m.t),bid:m.bid||0}))};
}
async function loadMeta(){
  const a=(await q("auction",t=>t.select("*").eq("id",1)))[0];
  S.meta=a&&a.phase!=="none"?{run:a.run,phase:a.phase,pausedAt:a.paused_at?Number(a.paused_at):null,launchedAt:Number(a.launched_at),dur:a.dur,settings:a.settings,liveLot:a.live_lot||null,drawing:a.drawing||null}:null;
}
let gotItems=false, gotAnns=false;
async function loadItems(){
  const [rows,mx]=await Promise.all([q("items",t=>t.select("*")),q("maxes",t=>t.select("*"))]);
  const before=S.items; S.maxes=mx; const n={}; rows.forEach(r=>n[r.id]=mapItem(r)); S.items=n; return before;
}
async function refreshItems(){
  try{ const before=await loadItems(); if(gotItems) onItems(before); else { gotItems=true; render(); } if(ui.sheet) loadHist(ui.sheet);
    if(ui.view==="screen"||(ui.view==="admin"&&ui.adm==="reports")) API.loadAllHist(); }
  catch(e){}
}
async function loadHist(id){
  try{ const d=await q("history",t=>t.select("*").eq("item_id",id).order("t",{ascending:true}));
    S.hist[id]=d.map(h=>({u:h.uid,amt:h.amt,t:Number(h.t),auto:h.auto,bin:h.bin,live:h.live})); if(ui.sheet===id) renderSheet(); }
  catch(e){}
}
async function loadPeople(){ const d=await q("people",t=>t.select("*")); const n={}; d.forEach(p=>n[p.uid]={name:p.name,paddle:p.paddle,bot:p.bot}); S.people=n; }
async function loadOrders(){ const d=await q("orders",t=>t.select("*")); const n={}; d.forEach(o=>n[o.id]={...o,u:o.uid,t:Number(o.t),don:Number(o.don),fee:Number(o.fee),total:Number(o.total),pledged:Number(o.pledged||0),dons:o.dons||[]}); S.orders=n; }
async function loadCatalog(){
  const d=await q("catalog",t=>t.select("*").order("no")); const n={};
  d.forEach(c=>n[c.id]={id:c.id,no:c.no,title:c.title,cat:c.cat,value:c.value,start:c.start,reserve:c.reserve,bin:c.bin,featured:c.featured,mode:c.mode||"silent",desc:c.descr||"",donor:c.donor||"",pickup:c.pickup||""});
  S.catalog=n; CATALOG=Object.values(n);
}
async function loadDrawings(){ const before=S.drawings; const d=await q("drawings",t=>t.select("*")); const n={}; d.forEach(x=>n[x.id]={...x.data,id:x.id}); S.drawings=n; onDrawings(before); }
async function loadPools(){ if(!isAdmin) return; const d=await q("pools",t=>t.select("*")); const n={}; d.forEach(x=>n[x.pool]={rows:x.rows||[]}); S.pools=n; }
async function loadConfig(){ const d=await q("config",t=>t.select("data").eq("id",1)); S.config=d[0]&&d[0].data&&Object.keys(d[0].data).length?d[0].data:null; }
async function loadDonations(){ const d=await q("donations",t=>t.select("*")); const n={}; d.forEach(x=>n[x.id]={...x,amount:Number(x.amount),t:Number(x.t)}); S.donations=n; }
async function loadAnns(first){ const d=await q("anns",t=>t.select("*")); const n={}; d.forEach(a=>n[a.id]={...a,t:Number(a.t)}); S.anns=n; onAnns(first); }
async function loadPhotos(){ const d=await q("photos",t=>t.select("*")); const n={}; d.forEach(p=>n[p.item_id]={list:p.list||[]}); S.photos=n; }
async function loadFeedback(){ if(!isAdmin) return; const d=await q("feedback",t=>t.select("*")); const n={}; d.forEach(f=>n[f.id]={...f,t:Number(f.t)}); S.feedback=n; }
function setSync(msg){ ui.offline=msg||null; render(); }
async function loadAll(){
  try{
    await loadMeta();
    await Promise.all([loadPeople(),loadOrders(),loadPhotos(),loadFeedback(),loadCatalog(),loadConfig(),loadDonations(),loadDrawings(),loadPools()]);
    await refreshItems(); await loadAnns(!gotAnns); gotAnns=true;
    if(ui.offline) ui.offline=null;
  }catch(e){ setSync("Can't reach the auction. Retrying…"); setTimeout(loadAll,5000); return; }
  render();
}
function listen(){
  const t={}; const later=(k,fn)=>{ clearTimeout(t[k]); t[k]=setTimeout(fn,150); };
  const on=(table,fn)=>ch.on("postgres_changes",{event:"*",schema:"public",table},()=>later(table,fn));
  const ch=sb.channel("auction-live");
  on("items",refreshItems);
  on("auction",async()=>{ await loadMeta(); render(); });
  on("people",async()=>{ await loadPeople(); render(); });
  on("orders",async()=>{ await loadOrders(); render(); });
  on("anns",async()=>{ await loadAnns(false); render(); });
  on("photos",async()=>{ await loadPhotos(); render(); if(ui.pm) renderPM(); });
  on("history",()=>{ if(ui.sheet) loadHist(ui.sheet); });
  on("catalog",async()=>{ await loadCatalog(); await refreshItems(); });
  on("config",async()=>{ await loadConfig(); render(); });
  on("drawings",async()=>{ await loadDrawings(); render(); });
  on("pools",async()=>{ await loadPools(); if(ui.view==="admin") render(); });
  on("donations",async()=>{ await loadDonations(); render(); });
  on("feedback",async()=>{ if(isAdmin){ await loadFeedback(); if(ui.view==="admin") render(); } });
  ch.subscribe(status=>{
    if(status==="SUBSCRIBED"){ if(ui.offline){ ui.offline=null; loadAll(); } }
    else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED") setSync("Reconnecting…");
  });
}
function stop(html){ document.body.classList.add("ok"); document.getElementById("view").innerHTML=`<section class="sec">${html}</section>`; document.getElementById("synctxt").textContent="Not connected"; }
function comingSoon(){
  document.title="Called to Care Auction · Coming soon";
  document.body.style.overflow="hidden";document.body.classList.add("ok");document.body.insertAdjacentHTML("beforeend",`<main style="position:fixed;inset:0;z-index:2147483000;overflow:auto;display:grid;place-items:center;padding:32px 20px;background:#1D4766;color:#fff;font-family:'Public Sans',system-ui,sans-serif;text-align:center">
   <div style="max-width:520px;display:grid;gap:18px;justify-items:center">
    <img src="img/logo-auction.png" alt="Called to Care Auction" style="width:min(320px,80vw);height:auto">
    <div style="font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;color:#F6C3DA">Charity Dinner &amp; Auction · Saturday, March 13, 2027</div>
    <h1 style="margin:0;font-family:'Bricolage Grotesque',Georgia,serif;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05">The auction opens soon.</h1>
    <p style="margin:0;color:#B5CFDC;font-size:1.1rem;line-height:1.6">Bidding opens the night of the dinner. Come back then to browse items and bid from your phone.</p>
    <a href="https://wearecalledtocare.com/#charity-dinner" style="display:inline-block;background:#E2197A;color:#fff;text-decoration:none;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem;padding:16px 30px;border-radius:999px">Charity Dinner Details</a>
   </div></main>`);
  setInterval(async()=>{ try{ const a=(await sb.rpc("my_access")).data; if(a&&a.open) location.reload(); }catch(e){} },60000);
}
async function start(){
  const cfg=window.AUCTION_CONFIG||{};
  if(!cfg.supabaseUrl||/YOUR-/.test(cfg.supabaseUrl+cfg.supabaseAnonKey)) return stop(`<h2>Almost there</h2><p>Add your Supabase Project URL and anon key to <b>config.js</b>, then upload the site again.</p>`);
  if(!window.supabase) return stop(`<h2>Couldn't load</h2><p>Check your internet connection and reload the page.</p>`);
  MODE="web"; sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!session){
    const r=await sb.auth.signInAnonymously();
    if(r.error) return stop(`<h2>Sign-in is turned off</h2><p>In Supabase, go to Authentication → Sign In / Providers and turn on <b>Allow anonymous sign-ins</b>, then reload.</p>`);
    session=r.data.session;
  }
  myUid=session.user.id;
  try{ const t0=Date.now(); const {data}=await sb.rpc("server_now"); const t1=Date.now(); if(data) OFFSET=Number(data)-(t0+t1)/2; }catch(e){}
  // Private preview link: ?preview=CODE unlocks this device before the auction goes live
  const pv=new URLSearchParams(location.search).get("preview");
  if(pv){ try{ await sb.rpc("enter_preview",{p_code:pv}); }catch(e){} history.replaceState(null,"",location.pathname+location.hash); }
  // Admin link from the website admin: #admin=CODE unlocks admin on this device, then the code is removed from the address
  const am=location.hash.match(/^#admin(?:=(.+))?$/);
  if(am){ ui.view="admin"; if(am[1]){ try{ const r=await sb.rpc("become_admin",{p_code:decodeURIComponent(am[1])}); if(r.data) ui.adminLink=true; }catch(e){} } history.replaceState(null,"",location.pathname+"#admin"); }
  // If the access check fails for any reason, show the coming-soon page (never the auction).
  let acc=null; for(let i=0;i<2&&!acc;i++){ try{ const r=await sb.rpc("my_access"); acc=r.error?null:r.data; }catch(e){} }
  if(!acc||(!acc.open&&!acc.admin&&!acc.tester)) return comingSoon();
  document.body.classList.add("ok");
  try{ isAdmin=(await q("admins",t=>t.select("uid"))).length>0; }catch(e){}
  try{ await loadCatalog(); }
  catch(e){ return stop(`<h2>Database not set up</h2><p>Run <b>setup.sql</b> in the Supabase SQL editor, then reload.</p>`); }
  loadL(); if(!L.acting) L.acting=myUid;
  await loadAll(); listen(); botLease();
  setInterval(()=>{ refreshItems(); loadMeta().then(render).catch(()=>{}); },20000);  // safety net if live updates drop
}
start();

})();
</script>
